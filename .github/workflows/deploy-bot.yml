# Деплой воркера бота @enttrainer_bot в Cloudflare при изменении ent-trainer/bot/
# Нужен секрет репозитория CLOUDFLARE_API_TOKEN (права: Workers Scripts Edit, D1 Edit).
name: Deploy bot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ent-trainer/bot/**']
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF: https://api.cloudflare.com/client/v4
      TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Аккаунт и база D1
        run: |
          set -euo pipefail
          H="Authorization: Bearer $TOKEN"
          ACC=$(curl -fsS -H "$H" "$CF/accounts" | jq -r '.result[0].id')
          [ -n "$ACC" ] && [ "$ACC" != null ] || { echo "Токен не видит аккаунт"; exit 1; }
          DBID=$(curl -fsS -H "$H" "$CF/accounts/$ACC/d1/database?name=ent-bot-stats" | jq -r '.result[] | select(.name=="ent-bot-stats") | .uuid' | head -1)
          if [ -z "$DBID" ]; then
            DBID=$(curl -fsS -H "$H" -H 'content-type: application/json' -X POST "$CF/accounts/$ACC/d1/database" -d '{"name":"ent-bot-stats"}' | jq -r '.result.uuid')
            echo "Создана база $DBID"
          fi
          cat > ent-trainer/bot/wrangler.toml <<TOML
          name = "ent-bot"
          main = "worker.js"
          compatibility_date = "2024-09-01"
          account_id = "$ACC"
          workers_dev = true

          [[d1_databases]]
          binding = "DB"
          database_name = "ent-bot-stats"
          database_id = "$DBID"
          TOML
          sed -i 's/^          //' ent-trainer/bot/wrangler.toml
          cat ent-trainer/bot/wrangler.toml
      - name: Deploy
        working-directory: ent-trainer/bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@3 deploy --keep-vars
      - name: Setup (вебхук, команды, таблица)
        run: |
          sleep 5
          curl -fsS https://ent-bot.damirnuss.workers.dev/setup | tee /tmp/setup.txt
          grep -q 'Готово' /tmp/setup.txt
